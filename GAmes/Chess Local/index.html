<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Chess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The page is intentionally split into a small header, board, controls, and modal layer. -->
  <main class="app-shell">
    <header class="game-header">
      <p class="eyebrow">LOCAL TWO-PLAYER GAME</p>
      <h1>CHESS</h1>
      <p id="turnStatus" class="turn-status" aria-live="polite">WHITE TO MOVE</p>
    </header>

    <!-- The table is the actual board; the surrounding assembly owns notation and rotation. -->
    <section class="board-wrap" aria-label="Chess board area">
      <div id="boardAssembly" class="board-assembly white-view">
        <div class="rank-labels" aria-hidden="true">
          <span>8</span><span>7</span><span>6</span><span>5</span>
          <span>4</span><span>3</span><span>2</span><span>1</span>
        </div>
        <table id="chessBoard" class="chess-board" aria-label="Chess board">
          <tbody></tbody>
        </table>
        <div class="file-labels" aria-hidden="true">
          <span>a</span><span>b</span><span>c</span><span>d</span>
          <span>e</span><span>f</span><span>g</span><span>h</span>
        </div>
      </div>
    </section>

    <div class="controls">
      <button id="resetButton" class="button" type="button">RESET GAME</button>
      <p id="message" class="message" aria-live="polite">Select a piece to see legal moves.</p>
    </div>
  </main>

  <!-- These dialogs are toggled by JavaScript and block board interaction while open. -->
  <div id="promotionModal" class="modal" hidden>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="promotionTitle">
      <p class="eyebrow">PAWN PROMOTION</p>
      <h2 id="promotionTitle">Choose a piece</h2>
      <div id="promotionChoices" class="promotion-choices"></div>
    </div>
  </div>

  <div id="gameOverModal" class="modal" hidden>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <p class="eyebrow">GAME COMPLETE</p>
      <h2 id="gameOverTitle">CHECKMATE</h2>
      <p id="gameOverResult" class="game-over-result">WHITE WINS</p>
      <button id="modalResetButton" class="button" type="button">RESET GAME</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
