<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b2b1c" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <link rel="icon" type="image/png" href="../../icons/javan.png" />
  <title>Math & Formula Calculator | JavanOffice</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="tool-shell">
    <header class="tool-header">
      <a class="back-link" href="../../index.html">← Main menu</a>
      <div class="header-copy">
        <p class="eyebrow">JAVANOFFICE TOOLS</p>
        <h1>Math &amp; Formula Calculator</h1>
      </div>
    </header>

    <main class="math-layout">
      <section class="panel selector-panel">
        <div class="panel-header">
          <h2>Formula library</h2>
        </div>

        <div class="selector-controls">
          <label class="field-label" for="formulaSearch">Search formulas</label>
          <input id="formulaSearch" type="search" placeholder="Type a formula or topic..." />

          <label class="field-label" for="formulaCategory">Category</label>
          <select id="formulaCategory"></select>

          <label class="field-label" for="formulaSelect">Choose a formula</label>
          <select id="formulaSelect"></select>
        </div>

        <div id="formulaList" class="formula-list" aria-live="polite"></div>
      </section>

      <section class="panel formula-panel">
        <div id="formulaOverview" class="formula-overview"></div>

        <div id="formulaInputs" class="formula-inputs" aria-live="polite"></div>

        <div class="formula-result-box">
          <h3>Equation</h3>
          <p id="formulaFormula" class="formula-text">Choose a formula to begin.</p>
          <h3>Result</h3>
          <p id="formulaAnswer" class="answer-text">Enter values to calculate.</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="formulas.js"></script>
  <script type="module" src="../../pwa-register.js"></script>
</body>

</html>
