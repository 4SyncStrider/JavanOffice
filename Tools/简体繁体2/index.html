<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b2b1c" />
  <link rel="manifest" href="../../manifest.webmanifest" />
  <link rel="icon" type="image/png" href="../../icons/javan.png" />
  <title>Chinese Converter | JavanOffice</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="tool-shell">
    <header class="tool-header">
      <a class="back-link" href="../../index.html">← Main menu</a>
      <div class="header-copy">
        <p class="eyebrow">JAVANOFFICE TOOLS</p>
        <h1>简体/繁體 转换</h1>
      </div>
    </header>

    <main class="converter-card">
      <div class="toolbar">
        <button type="button" class="convert-btn" data-direction="s2t">简体 → 繁體</button>
        <button type="button" class="convert-btn" data-direction="t2s">繁體 → 简体</button>
        <button type="button" class="secondary-btn" id="clearButton">Clear</button>
        <button type="button" class="secondary-btn" id="copyButton">Copy output</button>
      </div>

      <div class="editor-grid">
        <label class="field-label" for="inputText">Input</label>
        <textarea id="inputText" placeholder="Type or paste Chinese text here..."></textarea>

        <label class="field-label" for="outputText">Output</label>
        <textarea id="outputText" readonly placeholder="Converted text will appear here..."></textarea>
      </div>

      <p id="statusMessage" class="status" aria-live="polite">Ready to convert text.</p>
    </main>
  </div>

  <script type="module">
    import OpenCC from "full.js"

    const inputText = document.querySelector("#inputText");
    const outputText = document.querySelector("#outputText");
    const statusMessage = document.querySelector("#statusMessage");
    const convertButtons = document.querySelectorAll(".convert-btn");
    const clearButton = document.querySelector("#clearButton");
    const copyButton = document.getElementById("copyButton");

    console.log(copyButton);

    function makeConverter(from, to) {
      return OpenCC.Converter({ from: from, to: to });
    }

    function convertText(direction) {
      const text = inputText.value;

      if (!text.trim()) {
        outputText.value = "";
        statusMessage.textContent = "Input is empty. Please type or paste some Chinese text first.";
        return;
      }

      try {
        const converter = direction === "s2t" ? makeConverter("cn", "tw") : makeConverter("tw", "cn");

        outputText.value = converter(text);
        statusMessage.textContent =
          direction === "s2t"
            ? "Converted Simplified Chinese to Traditional Chinese."
            : "Converted Traditional Chinese to Simplified Chinese.";
      } catch (error) {
        outputText.value = "";
        statusMessage.textContent = "Conversion failed. Please try a different text sample.";
        console.error(error);
      }
    }

    convertButtons.forEach((button) => {
      button.addEventListener("click", () => convertText(button.dataset.direction));
    });

    clearButton.addEventListener("click", () => {
      inputText.value = "";
      outputText.value = "";
      statusMessage.textContent = "Ready to convert text.";
      inputText.focus();
    });

    copyButton.addEventListener("click", async () => {
      const content = outputText.value.trim();

      try {
        await navigator.clipboard.writeText(content);
        statusMessage.textContent = "Converted text copied to clipboard.";
      } catch {
        statusMessage.textContent =
          "Clipboard access was unavailable. Please copy the output manually.";
      }
    });

  </script>
  <script type="module" src="../../pwa-register.js"></script>
</body>

</html>
